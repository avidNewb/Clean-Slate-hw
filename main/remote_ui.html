<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Clock Remote">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1320" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Clock Remote</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6fa;
      --surface: #ffffff;
      --surface-soft: #eaf0f8;
      --text: #0f172a;
      --muted: #334155;
      --border: #94a3b8;
      --border-strong: #475569;
      --primary: #1d4ed8;
      --primary-text: #ffffff;
      --primary-soft: #dbeafe;
      --primary-soft-text: #1e3a8a;
      --sound-bg: #eef2ff;
      --sound-border: #4338ca;
      --sound-text: #1e1b4b;
      --stop-bg: #b91c1c;
      --stop-border: #7f1d1d;
      --stop-text: #ffffff;
      --ok-bg: #dcfce7;
      --ok-border: #15803d;
      --ok-text: #14532d;
      --warn-bg: #fef3c7;
      --warn-border: #b45309;
      --warn-text: #78350f;
      --focus: #1d4ed8;
      --nav-bg: #ffffff;
      --meter-empty: #cbd5e1;
      --meter-fill: #1d4ed8;
      --target-size: 48px;
      --nav-height: 5rem;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1320;
        --surface: #162033;
        --surface-soft: #1e2c45;
        --text: #f8fafc;
        --muted: #cbd5e1;
        --border: #64748b;
        --border-strong: #94a3b8;
        --primary: #60a5fa;
        --primary-text: #081226;
        --primary-soft: #1e3a5f;
        --primary-soft-text: #dbeafe;
        --sound-bg: #1e2948;
        --sound-border: #818cf8;
        --sound-text: #f1f5f9;
        --stop-bg: #dc2626;
        --stop-border: #fca5a5;
        --stop-text: #ffffff;
        --ok-bg: #14532d;
        --ok-border: #4ade80;
        --ok-text: #ecfdf5;
        --warn-bg: #451a03;
        --warn-border: #fbbf24;
        --warn-text: #fef3c7;
        --focus: #93c5fd;
        --nav-bg: #111a2b;
        --meter-empty: #334155;
        --meter-fill: #60a5fa;
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      scroll-padding-bottom: calc(var(--nav-height) + env(safe-area-inset-bottom, 0px) + 1rem);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-block-size: 100dvh;
      background: var(--bg);
      color: var(--text);
      overflow-wrap: break-word;
      padding-top: env(safe-area-inset-top, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: calc(var(--nav-height) + env(safe-area-inset-bottom, 0px) + 1.25rem);
    }

    h1, h2 {
      margin: 0;
      text-wrap: balance;
      line-height: 1.2;
    }

    p {
      margin: 0;
      text-wrap: pretty;
    }

    .app-shell {
      max-inline-size: 32rem;
      margin-inline: auto;
      padding: 0.9rem 1rem 0.5rem;
      container: remote / inline-size;
    }

    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-block-end: 0.75rem;
    }

    .top-header h1 {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .conn-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      border: 2px solid var(--ok-border);
      background: var(--ok-bg);
      color: var(--ok-text);
      font-size: 0.95rem;
      font-weight: 700;
      flex: 0 0 auto;
    }

    .conn-pill[data-state="offline"] {
      border-color: var(--warn-border);
      background: var(--warn-bg);
      color: var(--warn-text);
    }

    .status-bar {
      min-block-size: 3.1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.65rem 0.9rem;
      margin-block-end: 0.9rem;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: var(--surface);
      font-size: 1.08rem;
      font-weight: 700;
    }

    .status-bar[data-tone="ok"] {
      border-color: var(--ok-border);
      background: var(--ok-bg);
      color: var(--ok-text);
    }

    .status-bar[data-tone="warn"] {
      border-color: var(--warn-border);
      background: var(--warn-bg);
      color: var(--warn-text);
    }

    .retry-btn {
      min-block-size: 44px;
      min-inline-size: 84px;
      padding: 0.45rem 0.9rem;
      border-radius: 10px;
      border: 2px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
      flex: 0 0 auto;
    }

    /* Tab panels: never style padding/border on the tabpanel itself */
    .panel-inner {
      display: grid;
      gap: 1rem;
    }

    .card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 1rem;
      display: grid;
      gap: 0.85rem;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .card-head h2 {
      font-size: 1.12rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .mode-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      border: 2px solid var(--border);
      background: var(--surface-soft);
      color: var(--text);
      font-size: 0.92rem;
      font-weight: 800;
    }

    .now-showing {
      padding: 0.8rem 0.95rem;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: var(--surface-soft);
      text-align: center;
    }

    .now-showing-label {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .now-showing-value {
      margin-block-start: 0.2rem;
      font-size: 1.65rem;
      font-weight: 900;
      line-height: 1.15;
    }

    /* Base large remote button */
    .remote-btn {
      appearance: none;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      min-block-size: 80px;
      min-inline-size: var(--target-size);
      width: 100%;
      padding: 0.85rem 0.75rem;
      border-radius: 16px;
      border: 3px solid var(--border-strong);
      background: var(--surface-soft);
      color: var(--text);
      font-family: inherit;
      font-size: 1.25rem;
      font-weight: 800;
      line-height: 1.15;
      text-align: center;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: scale 120ms ease-out, box-shadow 120ms ease-out;
    }

    .remote-btn.row {
      flex-direction: row;
      gap: 0.65rem;
    }

    .remote-btn svg {
      width: 2rem;
      height: 2rem;
      flex: 0 0 auto;
    }

    .remote-btn:hover {
      box-shadow: 0 3px 10px rgb(0 0 0 / 0.16);
    }

    .remote-btn:active {
      scale: 0.97;
    }

    .remote-btn:focus-visible,
    .tab-btn:focus-visible,
    .retry-btn:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .remote-btn[aria-busy="true"] {
      opacity: 0.72;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-text);
    }

    .btn-sound {
      background: var(--sound-bg);
      border-color: var(--sound-border);
      color: var(--sound-text);
      min-block-size: 84px;
    }

    .btn-stop {
      background: var(--stop-bg);
      border-color: var(--stop-border);
      color: var(--stop-text);
      min-block-size: 76px;
      font-size: 1.35rem;
    }

    .btn-auto {
      min-block-size: 62px;
      font-size: 1.15rem;
    }

    .btn-auto[aria-pressed="true"] {
      background: var(--ok-bg);
      border-color: var(--ok-border);
      color: var(--ok-text);
    }

    .btn-vol-big {
      min-block-size: 92px;
      font-size: 1.55rem;
    }

    .btn-vol-big svg {
      width: 2.35rem;
      height: 2.35rem;
    }

    .btn-preset {
      min-block-size: 64px;
      font-size: 1.15rem;
      padding: 0.65rem 0.5rem;
    }

    .btn-preset[aria-pressed="true"] {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary-soft-text);
    }

    .btn-mute[aria-pressed="true"] {
      background: var(--warn-bg);
      border-color: var(--warn-border);
      color: var(--warn-text);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.85rem;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.7rem;
    }

    @container remote (inline-size < 20rem) {
      .grid-2,
      .grid-3 {
        grid-template-columns: 1fr;
      }
    }

    /* Volume Readout & Meter */
    .vol-readout {
      text-align: center;
      padding: 0.9rem 0.75rem;
      border-radius: 16px;
      border: 2px solid var(--border);
      background: var(--surface-soft);
    }

    .vol-number {
      font-size: 3.3rem;
      font-weight: 900;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
    }

    .vol-sub {
      margin-block-start: 0.25rem;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--muted);
    }

    .vol-meter {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 0.35rem;
      margin-block-start: 0.9rem;
    }

    .vol-seg {
      block-size: 1.25rem;
      border-radius: 6px;
      border: 2px solid var(--border-strong);
      background: var(--meter-empty);
    }

    .vol-seg.filled {
      background: var(--meter-fill);
      border-color: var(--meter-fill);
    }

    .alarm-alert-card {
      background: var(--stop-bg, #fee2e2);
      border: 3px solid var(--stop-border, #b91c1c);
      border-radius: 18px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .alarm-alert-card[hidden] {
      display: none;
    }

    .alarm-alert-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--stop-text, #991b1b);
      text-align: center;
    }

    .alarm-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .alarm-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.7rem 0.9rem;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: var(--surface-soft);
    }

    .alarm-row.off {
      opacity: 0.6;
    }

    .alarm-row-time {
      font-size: 1.35rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1.15;
    }

    .alarm-row-sub {
      font-size: 0.95rem;
      color: var(--muted);
    }

    .alarm-empty {
      margin: 0;
      font-size: 1rem;
      color: var(--muted);
    }

    /* Fixed Bottom 2-Page Switcher */
    .bottom-bar {
      position: fixed;
      inset-inline: 0;
      inset-block-end: 0;
      z-index: 20;
      background: var(--nav-bg);
      border-block-start: 2px solid var(--border);
      padding-top: 0.4rem;
      padding-bottom: max(0.6rem, env(safe-area-inset-bottom, 0px));
      padding-left: max(0.75rem, env(safe-area-inset-left, 0px));
      padding-right: max(0.75rem, env(safe-area-inset-right, 0px));
    }

    .tablist {
      max-inline-size: 32rem;
      margin-inline: auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .tab-btn {
      position: relative;
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      min-block-size: 62px;
      min-inline-size: var(--target-size);
      padding: 0.7rem 0.9rem;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: var(--surface-soft);
      color: var(--text);
      font-family: inherit;
      font-size: 1.25rem;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
      transition: scale 120ms ease-out;
    }

    .tab-btn svg {
      width: 1.75rem;
      height: 1.75rem;
      flex: 0 0 auto;
    }

    .tab-btn:active {
      scale: 0.97;
    }

    /* Indicate selected tab with both color and shape without shifting dimensions */
    .tab-btn[aria-selected="true"] {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-text);
    }

    .tab-btn[aria-selected="true"]::after {
      content: "";
      position: absolute;
      inset-inline: 1rem;
      inset-block-end: 4px;
      border-block-end: 4px solid currentColor;
      border-radius: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .remote-btn,
      .tab-btn {
        transition: none;
      }
      .remote-btn:active,
      .tab-btn:active {
        scale: none;
      }
    }

    @media (forced-colors: active) {
      .card,
      .status-bar,
      .now-showing,
      .vol-readout,
      .remote-btn,
      .tab-btn,
      .retry-btn,
      .conn-pill,
      .mode-tag,
      .vol-seg {
        box-shadow: none;
        border-color: ButtonText;
      }
      .tab-btn[aria-selected="true"],
      .btn-auto[aria-pressed="true"],
      .btn-preset[aria-pressed="true"],
      .btn-mute[aria-pressed="true"],
      .vol-seg.filled {
        background: Highlight;
        color: HighlightText;
        border-color: Highlight;
      }
      .remote-btn:focus-visible,
      .tab-btn:focus-visible,
      .retry-btn:focus-visible {
        outline: 3px solid CanvasText;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="top-header">
      <h1 id="device-title">Clock Remote</h1>
      <span class="conn-pill" id="conn-pill" data-state="ok">Ready</span>
    </header>

    <div class="status-bar" id="status-bar" role="status" aria-live="polite" data-tone="neutral">
      <span id="status-text">Ready to control clock</span>
      <button type="button" class="retry-btn" id="btn-retry" hidden>Retry</button>
    </div>

    <div class="alarm-alert-card" id="alarm-ringing-card" role="alert" hidden>
      <div class="alarm-alert-title">Alarm is Ringing!</div>
      <button type="button" class="remote-btn row btn-stop" id="btn-dismiss-alarm">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
          <rect x="5" y="5" width="14" height="14" rx="2"></rect>
        </svg>
        <span>Dismiss Alarm</span>
      </button>
    </div>

    <main>
      <!-- Page 1 (Default): Clock Screen Scroll & Sounds -->
      <section id="panel-remote" role="tabpanel" aria-labelledby="tab-remote">
        <div class="panel-inner">
          <div class="card">
            <div class="card-head">
              <h2>Clock Screen</h2>
              <span class="mode-tag" id="mode-tag">Auto</span>
            </div>

            <div class="now-showing">
              <div class="now-showing-label">Now Showing</div>
              <div class="now-showing-value" id="active-screen-name">Clock</div>
            </div>

            <div class="grid-2">
              <button type="button" class="remote-btn btn-primary" id="btn-prev-screen">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                <span>Previous</span>
              </button>

              <button type="button" class="remote-btn btn-primary" id="btn-next-screen">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
                <span>Next</span>
              </button>
            </div>

            <button type="button" class="remote-btn row btn-sound" id="btn-show-votd">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
              </svg>
              <span>Verse of the Day (3 min)</span>
            </button>

            <button type="button" class="remote-btn row btn-auto" id="btn-auto-screen" aria-pressed="true">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
                <polyline points="21 3 21 9 15 9"></polyline>
              </svg>
              <span id="btn-auto-label">Auto Schedule (On)</span>
            </button>
          </div>

          <div class="card">
            <div class="card-head">
              <h2>Sounds</h2>
            </div>

            <div class="grid-2">
              <button type="button" class="remote-btn btn-sound" data-sound="play_fight_song" data-label="Fight Song">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 18V5l12-2v13"></path>
                  <circle cx="6" cy="18" r="3"></circle>
                  <circle cx="18" cy="16" r="3"></circle>
                </svg>
                <span>Fight Song</span>
              </button>

              <button type="button" class="remote-btn btn-sound" data-sound="play_victory_song" data-label="Victory Song">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M6 9H4a2 2 0 0 1 0-4h2"></path>
                  <path d="M18 9h2a2 2 0 0 0 0-4h-2"></path>
                  <path d="M6 4h12v6a6 6 0 0 1-12 0V4z"></path>
                  <path d="M12 16v4"></path>
                  <path d="M8 20h8"></path>
                </svg>
                <span>Victory Song</span>
              </button>

              <button type="button" class="remote-btn btn-sound" data-sound="play_third_song" data-label="3rd Song">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                <span>3rd Song</span>
              </button>

              <button type="button" class="remote-btn btn-sound" data-sound="test_chime" data-label="Chime">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
                  <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span>Chime</span>
              </button>
            </div>

            <button type="button" class="remote-btn row btn-stop" id="btn-stop-sound">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                <rect x="5" y="5" width="14" height="14" rx="2"></rect>
              </svg>
              <span>Stop Sound</span>
            </button>
          </div>

          <div class="card">
            <div class="card-head">
              <h2>Alarms Set</h2>
              <a href="/#apps" class="mode-tag" style="text-decoration:none;">Edit</a>
            </div>
            <p class="alarm-empty" id="remote-alarms-empty">Loading alarms...</p>
            <ul class="alarm-list" id="remote-alarms-list" hidden></ul>
          </div>
        </div>
      </section>

      <!-- Page 2: Volume -->
      <section id="panel-volume" role="tabpanel" aria-labelledby="tab-volume" hidden>
        <div class="panel-inner">
          <div class="card">
            <div class="card-head">
              <h2>Speaker Volume</h2>
            </div>

            <div class="vol-readout">
              <div class="vol-number" id="vol-number">18</div>
              <div class="vol-sub" id="vol-sub">Out of 30</div>
              <div class="vol-meter" id="vol-meter" role="meter" aria-label="Speaker volume" aria-valuemin="0" aria-valuemax="30" aria-valuenow="18">
                <span class="vol-seg" aria-hidden="true"></span>
                <span class="vol-seg" aria-hidden="true"></span>
                <span class="vol-seg" aria-hidden="true"></span>
                <span class="vol-seg" aria-hidden="true"></span>
                <span class="vol-seg" aria-hidden="true"></span>
                <span class="vol-seg" aria-hidden="true"></span>
                <span class="vol-seg" aria-hidden="true"></span>
                <span class="vol-seg" aria-hidden="true"></span>
                <span class="vol-seg" aria-hidden="true"></span>
                <span class="vol-seg" aria-hidden="true"></span>
              </div>
            </div>

            <button type="button" class="remote-btn row btn-primary btn-vol-big" id="btn-vol-up">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
              </svg>
              <span>Louder (+)</span>
            </button>

            <button type="button" class="remote-btn row btn-vol-big" id="btn-vol-down">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              </svg>
              <span>Quieter (&minus;)</span>
            </button>

            <div class="grid-3">
              <button type="button" class="remote-btn btn-preset" data-vol-preset="10" aria-pressed="false">Quiet</button>
              <button type="button" class="remote-btn btn-preset" data-vol-preset="18" aria-pressed="false">Medium</button>
              <button type="button" class="remote-btn btn-preset" data-vol-preset="26" aria-pressed="false">Loud</button>
            </div>

            <div class="grid-2">
              <button type="button" class="remote-btn row btn-mute" id="btn-vol-mute" aria-pressed="false">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                  <line x1="23" y1="9" x2="17" y2="15"></line>
                  <line x1="17" y1="9" x2="23" y2="15"></line>
                </svg>
                <span id="btn-mute-label">Mute</span>
              </button>

              <button type="button" class="remote-btn row btn-sound" id="btn-vol-test">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
                  <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span>Test</span>
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <footer class="bottom-bar">
    <div class="tablist" role="tablist" aria-label="Remote pages">
      <button type="button" role="tab" id="tab-remote" class="tab-btn" aria-selected="true" tabindex="0">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="12" rx="2"></rect>
          <line x1="8" y1="20" x2="16" y2="20"></line>
          <line x1="12" y1="16" x2="12" y2="20"></line>
        </svg>
        <span>Remote</span>
      </button>

      <button type="button" role="tab" id="tab-volume" class="tab-btn" aria-selected="false" tabindex="-1">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
        <span>Volume</span>
      </button>
    </div>
  </footer>

  <script>
    (() => {
      const $ = (id) => document.getElementById(id);

      const state = {
        volume: 18,
        lastNonZeroVol: 18,
        activeApp: 'clock',
        pinnedApp: '',
        tempApp: '',
        tempRemainingSec: 0,
        online: true,
        alarmRinging: false,
        volTimer: null,
        volSending: false,
        volQueued: null,
        pollTimer: null,
        statusResetTimer: null
      };

      const SCREEN_LABELS = {
        clock: 'Clock',
        cfb_scoreboard: 'Football Scores',
        'cfb_scoreboard:scoreboard': 'Football Scores',
        'cfb_scoreboard:countdown_time': 'Football Countdown',
        'cfb_scoreboard:tv_info': 'Football TV & Weather',
        cfb_countdown_clock: 'Football Countdown',
        cfb_gameday_info: 'Football Gameday',
        cbb_scoreboard: 'Basketball Scores',
        'cbb_scoreboard:scoreboard': 'Basketball Scores',
        'cbb_scoreboard:countdown_time': 'Basketball Countdown',
        'cbb_scoreboard:tv_info': 'Basketball TV & Weather',
        birthdays: 'Birthdays',
        holidays: 'Holidays',
        bible_votd: 'Bible Verse',
        alarm: 'Alarm'
      };

      const tabs = [$('tab-remote'), $('tab-volume')];
      const panels = [$('panel-remote'), $('panel-volume')];
      const meterSegs = Array.from(document.querySelectorAll('#vol-meter .vol-seg'));
      const presetBtns = Array.from(document.querySelectorAll('[data-vol-preset]'));

      function formatScreenName(key) {
        if (!key) return 'Clock';
        if (SCREEN_LABELS[key]) return SCREEN_LABELS[key];
        const parts = String(key).split(':');
        const raw = parts.length > 1 ? parts[1] : parts[0];
        return raw
          .replace(/_/g, ' ')
          .replace(/\b\w/g, (c) => c.toUpperCase());
      }

      function buzz() {
        if (navigator.vibrate) {
          try { navigator.vibrate(18); } catch (_) {}
        }
      }

      function setBanner(msg, tone = 'neutral', autoClearMs = 0, showRetry = false) {
        const bar = $('status-bar');
        $('status-text').textContent = msg;
        bar.dataset.tone = tone;
        $('btn-retry').hidden = !showRetry;
        clearTimeout(state.statusResetTimer);
        if (autoClearMs > 0) {
          state.statusResetTimer = setTimeout(() => {
            if (state.online) {
              bar.dataset.tone = 'neutral';
              $('status-text').textContent = 'Ready to control clock';
              $('btn-retry').hidden = true;
            }
          }, autoClearMs);
        }
      }

      function setOnline(ok) {
        state.online = ok;
        const pill = $('conn-pill');
        pill.dataset.state = ok ? 'ok' : 'offline';
        pill.textContent = ok ? 'Ready' : 'Offline';
        if (!ok) {
          setBanner('Cannot reach clock. Check Wi-Fi.', 'warn', 0, true);
        } else {
          $('btn-retry').hidden = true;
        }
      }

      function renderScreenState() {
        const currentKey = state.tempApp || state.pinnedApp || state.activeApp || 'clock';
        $('active-screen-name').textContent = formatScreenName(currentKey);
        const isAuto = !state.pinnedApp && !state.tempApp;
        if (state.tempApp) {
          const mins = Math.max(1, Math.ceil((state.tempRemainingSec || 60) / 60));
          $('mode-tag').textContent = `Timed (${mins}m)`;
        } else {
          $('mode-tag').textContent = isAuto ? 'Auto' : 'Manual';
        }
        const autoBtn = $('btn-auto-screen');
        autoBtn.setAttribute('aria-pressed', isAuto ? 'true' : 'false');
        $('btn-auto-label').textContent = isAuto ? 'Auto Schedule (On)' : 'Return to Auto Schedule';
      }

      function renderVolumeState() {
        const vol = Math.max(0, Math.min(30, Number(state.volume) || 0));
        const muted = vol === 0;
        $('vol-number').textContent = muted ? 'MUTED' : String(vol);
        $('vol-sub').textContent = muted ? 'Volume is off (0 of 30)' : `${vol} of 30`;
        $('vol-meter').setAttribute('aria-valuenow', String(vol));

        const filledCount = muted ? 0 : Math.max(1, Math.round((vol / 30) * meterSegs.length));
        meterSegs.forEach((seg, idx) => {
          seg.classList.toggle('filled', idx < filledCount);
        });

        const muteBtn = $('btn-vol-mute');
        muteBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
        $('btn-mute-label').textContent = muted ? 'Unmute' : 'Mute';

        presetBtns.forEach((btn) => {
          const target = Number(btn.dataset.volPreset);
          btn.setAttribute('aria-pressed', vol === target ? 'true' : 'false');
        });
      }

      function selectTab(index, moveFocus = false) {
        const safeIdx = ((index % tabs.length) + tabs.length) % tabs.length;
        tabs.forEach((tab, idx) => {
          const active = idx === safeIdx;
          tab.setAttribute('aria-selected', active ? 'true' : 'false');
          tab.tabIndex = active ? 0 : -1;
          panels[idx].hidden = !active;
        });
        document.title = safeIdx === 1 ? 'Volume | Clock Remote' : 'Clock Remote';
        if (moveFocus) {
          tabs[safeIdx].focus();
        }
      }

      tabs.forEach((tab, idx) => {
        tab.addEventListener('click', () => {
          buzz();
          selectTab(idx, false);
        });
        tab.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
            e.preventDefault();
            selectTab(idx + 1, true);
          } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            e.preventDefault();
            selectTab(idx - 1, true);
          } else if (e.key === 'Home') {
            e.preventDefault();
            selectTab(0, true);
          } else if (e.key === 'End') {
            e.preventDefault();
            selectTab(tabs.length - 1, true);
          }
        });
      });

      async function fetchJson(url, opts = {}, timeoutMs = 4500) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), timeoutMs);
        try {
          const resp = await fetch(url, { ...opts, signal: ctrl.signal, cache: 'no-store' });
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          return await resp.json();
        } finally {
          clearTimeout(timer);
        }
      }

      async function postAction(payload) {
        return fetchJson('/api/local/action', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      }

      async function loadAlarms(forceFresh = false) {
        const emptyEl = $('remote-alarms-empty');
        const listEl = $('remote-alarms-list');
        try {
          const url = forceFresh ? '/api/local/cloud-config?fresh=1' : '/api/local/cloud-config';
          const cfg = await fetchJson(url, {}, 8000);
          const enabledSet = new Set(Array.isArray(cfg.enabled_apps) ? cfg.enabled_apps : []);
          const alarmEnabled = enabledSet.has('alarm');
          const acfg = (cfg.app_settings && cfg.app_settings.alarm) ? cfg.app_settings.alarm : {};
          const use24h = acfg.time_format === '24h';
          let entries = [];
          if (Array.isArray(acfg.alarms)) {
            entries = acfg.alarms;
          } else if (String(acfg.alarm_time || '').trim()) {
            entries = [{
              enabled: true,
              time: acfg.alarm_time,
              repeat: acfg.alarm_repeat !== false && Array.isArray(acfg.alarm_days) && acfg.alarm_days.length > 0,
              days: Array.isArray(acfg.alarm_days) ? acfg.alarm_days : [],
              label: acfg.alarm_label || 'WAKE UP!'
            }];
          }
          listEl.innerHTML = '';
          if (!entries.length) {
            emptyEl.textContent = 'No alarms set. Tap Edit to add an alarm.';
            emptyEl.hidden = false;
            listEl.hidden = true;
            return;
          }
          const dayNames = [['mon','Mon'],['tue','Tue'],['wed','Wed'],['thu','Thu'],['fri','Fri'],['sat','Sat'],['sun','Sun']];
          const fmtTime = (raw) => {
            const m = /^(\d{1,2}):(\d{2})$/.exec(String(raw || '07:00').trim());
            if (!m) return String(raw || '7:00 AM');
            let h = Number(m[1]);
            const min = m[2];
            if (use24h) return `${String(h).padStart(2, '0')}:${min}`;
            const ap = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            return `${h}:${min} ${ap}`;
          };
          const fmtDays = (days, repeat) => {
            const list = Array.isArray(days) ? days.map((d) => String(d).toLowerCase()) : [];
            if (repeat === false || !list.length) return 'Once';
            const s = new Set(list);
            if (s.size === 7) return 'Every day';
            if (s.size === 5 && ['mon','tue','wed','thu','fri'].every((d) => s.has(d))) return 'Mon–Fri';
            if (s.size === 2 && s.has('sat') && s.has('sun')) return 'Weekends';
            return dayNames.filter(([k]) => s.has(k)).map(([, lbl]) => lbl).join(', ');
          };
          entries.forEach((item) => {
            const active = alarmEnabled && item.enabled !== false;
            const li = document.createElement('li');
            li.className = `alarm-row${active ? '' : ' off'}`;
            const left = document.createElement('div');
            const t = document.createElement('div');
            t.className = 'alarm-row-time';
            t.textContent = fmtTime(item.time);
            const sub = document.createElement('div');
            sub.className = 'alarm-row-sub';
            const afterMins = Math.max(1, Math.min(60, Number(item.after_minutes) || 5));
            const afterTxt = item.after_action === 'bible_votd_gentle'
              ? ` · Gentle Bible Verse (${afterMins}m)`
              : (item.after_action === 'bible_votd' ? ` · + Bible Verse (${afterMins}m)` : '');
            sub.textContent = `${item.label || 'WAKE UP!'} · ${fmtDays(item.days, item.repeat)}${afterTxt}`;
            left.append(t, sub);
            const tag = document.createElement('span');
            tag.className = 'mode-tag';
            tag.textContent = active ? 'On' : (alarmEnabled ? 'Off' : 'App Off');
            li.append(left, tag);
            listEl.appendChild(li);
          });
          emptyEl.hidden = true;
          listEl.hidden = false;
        } catch (_) {
          emptyEl.textContent = 'Could not load alarms right now.';
          emptyEl.hidden = false;
          listEl.hidden = true;
        }
      }

      async function loadStatus(silent = true) {
        try {
          const st = await fetchJson('/api/local/status', {}, 4500);
          setOnline(true);
          const ringing = Boolean(st.alarm_ringing);
          const ringingChanged = ringing !== state.alarmRinging;
          state.alarmRinging = ringing;
          $('alarm-ringing-card').hidden = !ringing;
          if (ringingChanged) {
            loadAlarms(true);
          }
          if (st.settings && typeof st.settings.device_name === 'string' && st.settings.device_name.trim()) {
            $('device-title').textContent = st.settings.device_name.trim();
          }
          if (st.settings && typeof st.settings.df_volume === 'number' && !state.volSending && state.volQueued === null) {
            state.volume = Math.max(0, Math.min(30, st.settings.df_volume));
            if (state.volume > 0) state.lastNonZeroVol = state.volume;
            renderVolumeState();
          }
          if (typeof st.active_app === 'string') {
            state.activeApp = st.active_app;
          }
          state.pinnedApp = typeof st.pinned_app === 'string' ? st.pinned_app : '';
          state.tempApp = typeof st.temp_app === 'string' ? st.temp_app : '';
          state.tempRemainingSec = Number(st.temp_remaining_sec) || 0;
          renderScreenState();
          if (!silent) {
            setBanner('Connected to clock', 'ok', 2200);
          }
        } catch (_) {
          setOnline(false);
        }
      }

      async function flushVolumeQueue() {
        if (state.volSending || state.volQueued === null) return;
        const target = state.volQueued;
        state.volQueued = null;
        state.volSending = true;
        try {
          await postAction({ action: 'set_volume', volume: target });
          setOnline(true);
          setBanner(target === 0 ? 'Sound muted' : `Volume set to ${target}`, 'ok', 2200);
        } catch (_) {
          setOnline(false);
        } finally {
          state.volSending = false;
          if (state.volQueued !== null) {
            flushVolumeQueue();
          }
        }
      }

      function applyVolume(nextVol) {
        const clamped = Math.max(0, Math.min(30, Math.round(nextVol)));
        state.volume = clamped;
        if (clamped > 0) state.lastNonZeroVol = clamped;
        renderVolumeState();
        buzz();
        state.volQueued = clamped;
        clearTimeout(state.volTimer);
        state.volTimer = setTimeout(flushVolumeQueue, 120);
      }

      async function runStep(delta, btn) {
        buzz();
        btn.setAttribute('aria-busy', 'true');
        try {
          await postAction({ action: 'step_app', delta });
          setOnline(true);
          await loadStatus(true);
          const name = formatScreenName(state.pinnedApp || state.activeApp);
          setBanner(`Showing: ${name}`, 'ok', 2800);
        } catch (_) {
          setOnline(false);
        } finally {
          btn.removeAttribute('aria-busy');
        }
      }

      $('btn-prev-screen').addEventListener('click', (e) => runStep(-1, e.currentTarget));
      $('btn-next-screen').addEventListener('click', (e) => runStep(1, e.currentTarget));

      $('btn-show-votd').addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        buzz();
        btn.setAttribute('aria-busy', 'true');
        try {
          await postAction({ action: 'show_temp_app', app_id: 'bible_votd', duration_sec: 180 });
          setOnline(true);
          state.tempApp = 'bible_votd';
          state.tempRemainingSec = 180;
          state.activeApp = 'bible_votd';
          renderScreenState();
          setBanner('Showing Verse of the Day (3 min)', 'ok', 3200);
          setTimeout(() => loadStatus(true), 450);
        } catch (_) {
          setOnline(false);
        } finally {
          btn.removeAttribute('aria-busy');
        }
      });

      $('btn-auto-screen').addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        buzz();
        btn.setAttribute('aria-busy', 'true');
        try {
          await postAction({ action: 'set_app', app_id: '' });
          setOnline(true);
          state.pinnedApp = '';
          state.tempApp = '';
          state.tempRemainingSec = 0;
          renderScreenState();
          setBanner('Returned to Auto Schedule', 'ok', 2800);
          setTimeout(() => loadStatus(true), 450);
        } catch (_) {
          setOnline(false);
        } finally {
          btn.removeAttribute('aria-busy');
        }
      });

      document.querySelectorAll('[data-sound]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const action = btn.dataset.sound;
          const label = btn.dataset.label || 'Sound';
          buzz();
          btn.setAttribute('aria-busy', 'true');
          try {
            await postAction({ action });
            setOnline(true);
            if (state.volume === 0) {
              setBanner('Volume is muted — open Volume tab to turn up', 'warn', 4000);
            } else {
              setBanner(`Playing ${label}`, 'ok', 3000);
            }
          } catch (_) {
            setOnline(false);
          } finally {
            btn.removeAttribute('aria-busy');
          }
        });
      });

      $('btn-dismiss-alarm').addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        buzz();
        btn.setAttribute('aria-busy', 'true');
        try {
          await postAction({ action: 'dismiss_alarm' });
          setOnline(true);
          state.alarmRinging = false;
          $('alarm-ringing-card').hidden = true;
          loadAlarms(true);
          setBanner('Alarm dismissed', 'ok', 2800);
        } catch (_) {
          setOnline(false);
        } finally {
          btn.removeAttribute('aria-busy');
        }
      });

      $('btn-stop-sound').addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        buzz();
        btn.setAttribute('aria-busy', 'true');
        try {
          await postAction({ action: 'stop_audio' });
          setOnline(true);
          setBanner('Sound stopped', 'ok', 2600);
        } catch (_) {
          setOnline(false);
        } finally {
          btn.removeAttribute('aria-busy');
        }
      });

      $('btn-vol-up').addEventListener('click', () => applyVolume(state.volume + 2));
      $('btn-vol-down').addEventListener('click', () => applyVolume(state.volume - 2));

      presetBtns.forEach((btn) => {
        btn.addEventListener('click', () => applyVolume(Number(btn.dataset.volPreset)));
      });

      $('btn-vol-mute').addEventListener('click', () => {
        if (state.volume === 0) {
          applyVolume(state.lastNonZeroVol > 0 ? state.lastNonZeroVol : 18);
        } else {
          state.lastNonZeroVol = state.volume;
          applyVolume(0);
        }
      });

      $('btn-vol-test').addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        buzz();
        btn.setAttribute('aria-busy', 'true');
        try {
          if (state.volQueued !== null) {
            clearTimeout(state.volTimer);
            await flushVolumeQueue();
          }
          await postAction({ action: 'test_chime' });
          setOnline(true);
          setBanner(state.volume === 0 ? 'Sound is muted (volume 0)' : `Testing volume (${state.volume})`, state.volume === 0 ? 'warn' : 'ok', 2800);
        } catch (_) {
          setOnline(false);
        } finally {
          btn.removeAttribute('aria-busy');
        }
      });

      $('btn-retry').addEventListener('click', () => {
        buzz();
        loadStatus(false);
      });

      renderScreenState();
      renderVolumeState();
      loadStatus(true);
      loadAlarms();
      state.pollTimer = setInterval(() => {
        if (!document.hidden) loadStatus(true);
      }, 6000);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          loadStatus(true);
          loadAlarms();
        }
      });
    })();
  </script>
</body>
</html>
